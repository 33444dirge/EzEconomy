name: JiuJiuEco
main: city.jiujiu.eco.bukkit.JiuJiuEco
version: ${project.version}
api-version: '1.13'
folia-supported: true
load: STARTUP
depend: [Vault, JiuJiuLib]
commands:
  balance:
    description: 查询 J 点余额
    aliases: [bal]
    usage: /balance [玩家]
  pay:
    description: 向其他玩家转账 J 点
    usage: /pay <玩家> <金额>
    permission: jiujiueco.user.pay
  eco:
    description: 增加、扣除或设置玩家的 J 点余额
    usage: /eco <give|take|set> <玩家> <金额>
permissions:
  jiujiueco.reload:
    default: op
  jiujiueco.user.pay:
    default: true
  jiujiueco.user.balance.others:
    default: op
  jiujiueco.eco:
    default: op
  jiujiueco.eco.give:
    default: op
  jiujiueco.eco.take:
    default: op
  jiujiueco.eco.set:
    default: op
