# EzEconomy configuration
# storage: 'yml', 'mysql', 'sqlite', or 'mongodb'
storage: yml

# Language selection for the language file in `languages/` (e.g. en, nl, es)
# The plugin loads `languages/<language>.yml` and falls back to `languages/en.yml`.
language: en

# Enable debug/verbose logging for EzEconomy and its internal libraries (e.g. Jaloquent).
# Set to `true` to see detailed diagnostic output in the server console.
# Keep `false` in production to avoid log spam.
debug: false

# Optionally create a wallet record when a player joins.
store-on-join:
  enabled: false


# Independent wallet currencies; transfers keep the selected currency.
multi-currency:
  enabled: false
  default: "dollar"
  currencies:
    dollar:
      display: "Dollar"
      symbol: "$"
      decimals: 2
    euro:
      display: "Euro"
      symbol: "€"
      decimals: 2
    gem:
      display: "Gem"
      symbol: "♦"
      decimals: 0
locking-strategy: NONE

# Locking timing configuration (applies to all strategies)
locking:
  ttl-ms: 5000
  retry-ms: 50
  max-attempts: 100

# Cross-server messaging (requires a proxy plugin: Velocity or BungeeCord)
cross-server:
  enabled: false

# Caching strategy used for in-memory / distributed caching. Options:
#   LOCAL     - in-process memory cache only (default)
#   REDIS     - use the Redis extension for a central cache
#   BUNGEECORD - proxy-backed cache via plugin messaging (requires proxy component)
#   DATABASE  - use the configured SQL storage as a cache backend
# If not present, the plugin will fall back to `locking-strategy` for backward compatibility.
caching-strategy: LOCAL

# Performance tuning for hot balance paths (Vault + placeholders).
performance:
  # Enables the Vault deposit/withdraw hot path for single-server LOCAL cache mode.
  # Balance changes are applied to memory immediately and flushed to storage
  # asynchronously, with a final flush during plugin shutdown.
  fast-vault-mutations:
    enabled: true
    shutdown-flush-timeout-ms: 15000
  balance-cache:
    enabled: true
    ttl-ms: 2500
  mysql:
    jdbc-params: "useSSL=false&serverTimezone=UTC&cachePrepStmts=true&prepStmtCacheSize=1024&prepStmtCacheSqlLimit=4096&useServerPrepStmts=true&elideSetAutoCommits=true&maintainTimeStats=false&useLocalSessionState=true&rewriteBatchedStatements=true&cacheResultSetMetadata=true&cacheServerConfiguration=true&tcpKeepAlive=true&connectTimeout=8000&socketTimeout=30000"
    pool:
      enabled: true
      maximum-pool-size: 32
      minimum-idle: 8
      connection-timeout-ms: 8000
      idle-timeout-ms: 240000
      max-lifetime-ms: 1200000
    # MySQL performance tuning defaults (optional overrides; keys mirror config-mysql.yml)
    background-queue-size: 10000
    balance-background-queue-size: 10000
    balance-background-batch-size: 128
    balance-background-flush-interval-ms: 200

# Note: MySQL performance tuning defaults have been moved under `performance.mysql` above.

# Presentation settings for money formatting. These settings affect only
# how amounts are shown to players and in integrations (placeholders, GUIs,
# chat). Monetary storage and arithmetic remain unchanged.
money-format:
  pattern: "#,##0.00"          # DecimalFormat pattern used for formatting
  locale: "en_US"             # Locale used for separators and currency symbol
  currencySymbol: ""         # Symbol to use (overrides locale symbol if provided). Empty to use locale.
  symbolPlacement: "prefix"   # prefix|suffix
  showTrailingZeros: true       # always show two decimals (1.50 vs 1.5)
  roundingMode: "HALF_UP"     # HALF_UP, HALF_EVEN, DOWN, etc.
  negativeFormat: "-amount"   # "-amount" or "(amount)"
  useCompact: true             # show 1.2K style in some UIs (compact representation)
  compact:
    thresholds:
      thousand: 1000
      million: 1000000
      billion: 1000000000
    suffixes:
      thousand: "K"
      million: "M"
      billion: "B"
    precision: 1
  colors:
    useColors: true
    positive: "&a"             # legacy color code prefix for positive values
    negative: "&c"             # legacy color code prefix for negative values

# Pay command settings
pay:
  # Confirmation threshold (amount >= threshold requires /pay confirm)
  confirmation:
    threshold: -1.0
    timeout_seconds: 30

  # Pay-all (*) feature
  pay_all:
    # Enabled by default. Set to false to disable /pay * entirely.
    enabled: true
    # Require extra permission to use /pay * (default: true). If false, any player with ezeconomy.pay may use it.
    require_permission: true
    # When true, /pay * will include offline players (based on stored balances).
    # Default: false (only online players are targeted).
    include_offline: false
